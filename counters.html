<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Counters · DeadLock_Noob</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/counters.css">
</head>
<body data-page="counters" data-rang>
  <header id="barre"></header>

  <div id="erreur" class="erreur" hidden>
    <h1>Données introuvables</h1>
    <p id="erreur-texte"></p>
    <p>Depuis le dossier du projet, lancer <code>python -m http.server</code> puis ouvrir
      <code>http://localhost:8000</code>.</p>
  </div>

  <main id="app" class="page page-counters" hidden>
    <section class="panneau" aria-label="Choix des héros">
      <div id="modes" class="filtres modes" role="group" aria-label="Mode"></div>
      <div id="cibles" class="filtres modes" role="group" aria-label="Équipe à remplir"></div>
      <h2><span id="titre-grille">En face</span> <span id="compte" class="note"></span>
        <button id="btn-vider" class="btn discret" type="button">Vider</button></h2>
      <div id="grille" class="heros-grille-roles"></div>
    </section>
    <div id="resultat" class="counters-resultat"></div>
  </main>

  <footer id="meta" class="meta"></footer>

  <script src="js/commun.js"></script>
  <script src="js/counters.js"></script>
</body>
</html>
